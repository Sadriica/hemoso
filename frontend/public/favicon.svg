<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- HeMoSo mark: a reading point inside a ring, crossed by a thin orbit.
       Colours from the app tokens (dark theme): space black and ice blue. -->
  <rect width="32" height="32" rx="7" fill="#080b12" />
  <ellipse
    cx="16"
    cy="16"
    rx="12"
    ry="4.6"
    fill="none"
    stroke="#a9d6ff"
    stroke-width="1.4"
    transform="rotate(-25 16 16)"
  />
  <circle cx="16" cy="16" r="4.4" fill="none" stroke="#a9d6ff" stroke-width="2.2" />
  <circle cx="16" cy="16" r="1.5" fill="#a9d6ff" />
</svg>
